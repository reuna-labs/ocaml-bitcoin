name: CI

on:
  push:
    branches: [master, "rewrite/**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ["4.14", "5.1", "5.2", "5.3"]
        include:
          - os: macos-latest
            ocaml-compiler: "5.3"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      # The crypto dependencies are not yet on opam; bitcoin.opam.template
      # pins them by commit sha, which opam honours here.
      - run: opam install --deps-only --with-test .
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
      # Exactly the version named in .ocamlformat, or the check is meaningless.
      - run: opam install ocamlformat.0.27.0
      - run: opam exec -- dune build @fmt

  unix-free:
    # The core library must build inside a unikernel, where none of this
    # exists. Cheap to check, and it keeps working while the solo5 job is red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject I/O and platform dependencies under lib/
        run: |
          set -e
          ! grep -rnE '\b(Unix|Thread|Lwt|Async|Mutex|Domain)\.' lib/
          ! grep -rnE '\b(open_in|open_out|Sys\.(command|argv|getenv)|Random\.self_init|print_endline|print_string)\b' lib/

  solo5:
    # Cross-builds the library into a MirageOS/Solo5 unikernel. This has been
    # verified locally to produce a binary that runs (see unikernel/README.md);
    # it stays continue-on-error here only because the mirage-crypto fork it
    # needs is not public, so the clone below cannot succeed on a public
    # runner. Remove the flag once that fork is published.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          # ocaml-solo5 pins an exact compiler per release; 1.3.3 wants this
          # one. Pairing it with 4.14 does not resolve.
          ocaml-compiler: "5.4.1"
      # Zarith is not built with dune upstream and so cannot be vendored by
      # opam-monorepo; the overlay provides zarith.1.14+dune+mirage.
      - run: opam repository add overlays https://github.com/dune-universe/opam-overlays.git
      - run: opam install ocaml-solo5 mirage opam-monorepo
      - run: git clone --depth 1 https://github.com/reuna147/mirage-crypto.git ../mirage-crypto
      - run: MIRAGE_CRYPTO=$(cd ../mirage-crypto && pwd) opam exec -- ./unikernel/build.sh hvt

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
      - run: opam install --deps-only --with-doc .
      # odoc 3 changed the driver interface; dune's classic @doc target only
      # works with odoc 2, and @doc-new only with odoc 3.
      - run: opam install "odoc>=3.0.0"
      - run: opam exec -- dune build @doc-new
